  openSheet(`<div class="yhero" style="padding-bottom:22px"><div class="yy" style="font-size:44px;letter-spacing:-1px">Netflix ✓</div><p>${ok.serie.length} serie · ${ok.film.length} film importati con le date vere</p></div>
    <div class="pad"><div class="box"><h4>Serie</h4>${ok.serie.map(x => `<div class="set" data-act="openShow" data-id="${x.id}" role="button"><div class="l"><b>${esc(x.nome)}</b><small>${x.segnati} episodi segnati${x.segnati < x.tot ? ` (su ${x.tot} nel file)` : ''}</small></div><span class="lnk">›</span></div>`).join('') || '<p class="cap2">Nessuna</p>'}</div>
    <div class="box"><h4>Film</h4><p class="plot" style="font-size:14px">${ok.film.map(x => esc(x.nome)).join(' · ') || 'Nessuno'}</p></div>
    ${ko.length ? `<div class="box"><h4>Non riconosciuti (${ko.length})</h4><p class="plot" style="font-size:14px">${ko.map(esc).join(' · ')}</p><p class="cap2" style="white-space:normal;margin-top:8px">Questi puoi aggiungerli a mano con la ricerca.</p></div>` : ''}
    <p class="cap2" style="white-space:normal;text-align:center;margin-top:14px">Controlla pure che sia tutto giusto: ogni cosa si può correggere dalla scheda del titolo.</p></div>`);
}

/* ---------- IMPORTAZIONI PREPARATE (file importa.json nel repository dei dati) ---------- */
async function controllaImport(){
  if (!C.ghToken || !C.ghUser || !C.tmdb) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(C.ghUser)}/${encodeURIComponent(C.ghRepo)}/contents/importa.json?t=${Date.now()}`, {headers:ghH(), cache:'no-store'});
    if (!r.ok) return;
    const imp = JSON.parse(b64d((await r.json()).content));
    if ((D.importati || []).includes(imp.id)) return;
    if (imp.soloDate){
      let n = 0;
      for (const f of imp.film){ const m = Object.values(D.movies).find(x => norm(x.title) === norm(f.title)); if (m && m.state === 'seen' && !m.seenAt){ m.seenAt = f.d; n++; } }
      for (const e of (imp.episodi || [])){ const sh = D.series[e.s]; if (sh && sh.watched[e.e] === 1){ sh.watched[e.e] = e.ts; n++; } }
      D.importati = [...(D.importati || []), imp.id]; save(); render();
      if (n) toast(`📅 Ripristinate ${n} date di visione`, null, null, 5000);
      return;
    }
    UI.imp = imp;
    $('#mcard').innerHTML = `<h3>${esc(imp.titolo || 'Importazione pronta')}</h3><div class="s">Ho preparato <b>${imp.serie.length} serie</b> e <b>${imp.film.length} film</b> da aggiungere, con le date.</div>
      <p class="plot" style="font-size:14px">${esc(imp.nota || '')}</p>
      <div class="mrow"><button class="btn ghost" data-act="closeModal">Più tardi</button><button class="btn" data-act="impGo">Importa</button></div>`;
    $('#modal').classList.add('open');
  } catch(e){}
}
async function importaLista(imp){
  const tot = imp.serie.length + imp.film.length; let n = 0;
  const ok = {serie:[], film:[]}, ko = [];
  const prog = () => toast(`📥 Importo… ${++n} di ${tot}`, null, null, 60000);
  const ts = d => new Date(d + 'T21:00').getTime();
  for (const s of imp.serie){
    prog();
    try {
      const id = await trovaSerie(s.name, s.alt); if (!id){ ko.push(s.name); continue; }
      const sh = D.series[id], oggiS = oggi(); let segnati = 0;
      const mark = (e, v) => { const cur = sh.watched[e.i]; if (v === 1){ if (!cur){ sh.watched[e.i] = 1; segnati++; } } else if (!(cur > 1e11)){ sh.watched[e.i] = v; segnati++; } };
      for (const sp of (s.seasons || [])){
        let sn = sp.s;
        if (sn === 'auto'){ const seas = [...new Set(sh.eps.filter(e => e.d && e.d <= sp.before).map(e => e.s))]; sn = Math.max(0, ...seas); }
        const eps = sh.eps.filter(e => e.s === sn && e.d && e.d <= oggiS).sort((a, b) => a.n - b.n);
        if (sp.past){ eps.forEach(e => mark(e, 1)); continue; }
        const ds = [...(sp.dates || [])].sort();
        eps.forEach((e, i) => mark(e, ds.length ? ts(ds[Math.min(ds.length - 1, Math.floor(i * ds.length / eps.length))]) : 1));
      }
      for (const r of (s.range ? [s.range] : [])) sh.eps.filter(e => e.s >= r[0] && e.s <= r[1] && e.d && e.d <= oggiS).forEach(e => mark(e, 1));
      const last = Math.max(0, ...Object.values(sh.watched).filter(v => v > 1e11)); if (last) sh.lastW = Math.max(sh.lastW || 0, last);
      ok.serie.push({id, nome:showName(sh), segnati, nota:s.nota || ''});
      await sleep(150);
    } catch(e){ ko.push(s.name); }
  }
  for (const f of imp.film){
    prog();
    try {
      let r = await tmdb('/search/movie', Object.assign({query:f.title, region:'IT'}, f.year ? {year:f.year} : {})); let t = r.results?.[0];
      if (!t){ ko.push(f.title); continue; }
      if (D.movies[t.id]?.state === 'seen'){ if (!D.movies[t.id].seenAt) D.movies[t.id].seenAt = f.d; ok.film.push({id:t.id, nome:D.movies[t.id].title}); continue; }
      const m = await fetchMovie(t.id);
      D.movies[m.id] = Object.assign(D.movies[m.id] || {rating:0, comment:''}, m, {state:'seen', seenAt:f.d, added:D.movies[m.id]?.added || Date.now()});
      ok.film.push({id:m.id, nome:m.title});
      await sleep(120);
    } catch(e){ ko.push(f.title); }
  }
  D.importati = [...(D.importati || []), imp.id];
  save(); render(); $('#toast').classList.remove('on');
  openSheet(`<div class="yhero" style="padding-bottom:22px"><div class="yy" style="font-size:40px;letter-spacing:-1px">${esc(imp.etichetta || 'Importato')} ✓</div><p>${ok.serie.length} serie · ${ok.film.length} film</p></div>
    <div class="pad"><div class="box"><h4>Serie</h4>${ok.serie.map(x => `<div class="set" data-act="openShow" data-id="${x.id}" role="button"><div class="l"><b>${esc(x.nome)}</b><small>${x.segnati} episodi segnati${x.nota ? ' · ' + esc(x.nota) : ''}</small></div><span class="lnk">›</span></div>`).join('') || '<p class="cap2">Nessuna</p>'}</div>
    <div class="box"><h4>Film</h4><p class="plot" style="font-size:14px">${ok.film.map(x => esc(x.nome)).join(' · ') || 'Nessuno'}</p></div>
    ${ko.length ? `<div class="box"><h4>Non riconosciuti (${ko.length})</h4><p class="plot" style="font-size:14px">${ko.map(esc).join(' · ')}</p></div>` : ''}</div>`);
}

/* ---------- NOTIFICHE PUSH ---------- */
const VAPID = 'BFSSzAkBuNgcHx48tOhbXcqYcAL6EgBl46za0Il00uk9vKRlJRfW1OzNPjNiijyngPOSZ17wbTQubKnl-Ah5yB0';
const isIpad = () => /iPad/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const pushPossibile = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
function statoNotifiche(){
  if (!pushPossibile()) return {ok:false, t:'Apri Visto! dall\'icona sulla schermata Home (non da Safari) per poterle attivare'};
  if (!C.ghToken || !C.ghUser) return {ok:false, t:'Prima attiva la sincronizzazione qui sotto'};
  if (Notification.permission === 'denied') return {ok:false, t:'Bloccate: riattivale in Impostazioni iPhone → Notifiche → Visto!'};
  if (C.pushOn && Notification.permission === 'granted') return {ok:true, t:`Attive su questo ${isIpad() ? 'iPad' : 'iPhone'} ✓ · nuove stagioni, ritorni e film in uscita`};
  return {ok:false, t:'Nuove stagioni, ritorni delle serie e film in uscita, anche ad app chiusa'};
}
async function attivaNotifiche(){
  try {
    if (!pushPossibile()) return toast('Apri Visto! dall\'icona della schermata Home');
    if (!C.ghToken) return toast('Prima attiva la sincronizzazione');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Permesso non concesso');
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(VAPID.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - VAPID.length % 4) % 4)), c => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:key});
    C.devId = C.devId || (isIpad() ? 'ipad-' : 'iphone-') + Math.random().toString(36).slice(2, 8); saveCfg();
    const url = `https://api.github.com/repos/${encodeURIComponent(C.ghUser)}/${encodeURIComponent(C.ghRepo)}/contents/push.json`;
    let sha, cur = {subs:{}};
    const g = await fetch(url + '?t=' + Date.now(), {headers:ghH(), cache:'no-store'});
    if (g.ok){ const j = await g.json(); sha = j.sha; try { cur = JSON.parse(b64d(j.content)); } catch(e){} }
    cur.subs = cur.subs || {};
    cur.subs[C.devId] = {name:isIpad() ? 'iPad' : 'iPhone', at:Date.now(), sub:sub.toJSON()};
    const body = {message:'Visto!: notifiche attivate su ' + cur.subs[C.devId].name, content:b64e(JSON.stringify(cur, null, 1))};
    if (sha) body.sha = sha;
    const r = await fetch(url, {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, ghH()), body:JSON.stringify(body)});
    if (!r.ok) throw new Error('GitHub ' + r.status);
    C.pushOn = true; saveCfg(); render();
    toast('🔔 Notifiche attivate! Tra un paio di minuti arriva quella di benvenuto', null, null, 6000);
  } catch(e){ toast('Non riesco ad attivarle: ' + esc(e.message)); }
}

/* ---------- AGGIORNAMENTO AUTOMATICO ---------- */
async function checkUpdate(){
  try {
    const r = await fetch('./index.html?nc=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/const VERSIONE = '([0-9.]+)'/);
    if (m && m[1] !== VERSIONE){ try { sessionStorage.setItem('vistoUpd', m[1]); } catch(e){} toast(`✨ Aggiorno Visto! alla versione ${m[1]}…`); setTimeout(() => location.replace('./?v=' + m[1]), 1200); }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });


/* Sul computer la rotellina del mouse fa scorrere in orizzontale le righe di locandine */
document.addEventListener('wheel', e => {
  const r = e.target.closest && e.target.closest('.nrow,.recrow,.castrow,.schips');
  if (!r || Math.abs(e.deltaX) > Math.abs(e.deltaY) || r.scrollWidth <= r.clientWidth) return;
  const max = r.scrollWidth - r.clientWidth;
  if ((e.deltaY < 0 && r.scrollLeft <= 0) || (e.deltaY > 0 && r.scrollLeft >= max - 1)) return;
  e.preventDefault(); r.scrollLeft += e.deltaY;
}, {passive:false});
/* ---------- AVVIO ---------- */
(async function init(){
  render();
  checkUpdate();
  let upd = null; try { upd = sessionStorage.getItem('vistoUpd'); sessionStorage.removeItem('vistoUpd'); } catch(e){}
  if (upd){ $('#intro').remove(); setTimeout(() => toast(`✨ Visto! aggiornata alla versione <b>${VERSIONE}</b>`), 400); }
  else if (C.intro){
    introStats(); polvere();
    const cache = load(POSTERS); buildWall(cache?.list || []);
    posterPool().then(list => { if (!cache && list.length) buildWall(list); });
  } else $('#intro').remove();
  await pull();
  setTimeout(controllaImport, 1500);
  UI.vn = 0;
  caricaMM().then(() => { // voti arrivati di notte: alla prima apertura si mostrano subito
    if (!UI.vn) return;
    const mostra = (t = 0) => { const n = D.news.find(x => x.id === `voti-${oggi()}`); if (!n) return;
      if ($('#cele') || $('#modal').classList.contains('open') || $('#intro')){ if (t < 80) setTimeout(() => mostra(t + 1), 1500); return; }
      n.read = true; save(); render(); votiModal(n, true); };
    setTimeout(mostra, 1800);
  });
  if (C.tmdb && Object.values(D.series).some(s => !s.tmdb || !s.itEp)) enrichAll();
  await checkNews(false);
  migGeneri().then(migPoster);
  loadRecs();
})();
