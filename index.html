/* ---------- AZIONI ---------- */
function markEp(sh, epId, on){ if (on){ sh.watched[epId] = Date.now(); sh.lastW = Date.now(); } else delete sh.watched[epId]; }
function burst(el){
  const r = el.getBoundingClientRect(), cols = ['#ff5e62','#ffb648','#ffc857','#7d6bff','#22b8aa'];
  for (let i = 0; i < 14; i++){
    const p = document.createElement('div'); p.className = 'burst'; p.style.background = cols[i % 5];
    p.style.left = r.left + r.width / 2 + 'px'; p.style.top = r.top + r.height / 2 + 'px'; document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    p.animate([{transform:'translate(0,0) rotate(0)', opacity:1}, {transform:`translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) rotate(${Math.random() * 360}deg)`, opacity:0}], {duration:650, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => p.remove();
  }
}
function toast(msg, label, fn, ms = 4000){
  const t = $('#toast'); t.innerHTML = `<span>${msg}</span>${label ? `<button id="tBtn">${label}</button>` : ''}`; t.classList.add('on');
  if (label) $('#tBtn').onclick = () => { t.classList.remove('on'); fn(); };
  clearTimeout(UI.tt); UI.tt = setTimeout(() => t.classList.remove('on'), ms);
}
function refreshView(){ if (UI.open?.type === 'show') showSheet(UI.open.id, true); else if (UI.open?.type === 'movie') movieSheet(UI.open.id, true); else render(); }

const A = {
  enter(){ $('#intro').classList.add('out'); setTimeout(() => $('#intro').remove(), 900); },
  tab(d){ UI.tab = d.t; if ($('#sheet').classList.contains('open')) closeSheet(); render(); scrollTo(0, 0); },
  filmSeg(d){ UI.filmSeg = d.s; render(); },
  search(){ searchSheet(); },
  sType(d){ const q = $('#q')?.value || ''; searchSheet(d.s); $('#q').value = q; doSearch(q.trim()); },
  closeSheet(){ closeSheet(); },
  openShow(d){ showSheet(+d.id); },
  openMovie(d){ movieSheet(d.id); },
  async addShow(d, el){
    if (el.classList.contains('done')) return;
    el.textContent = 'Aggiungo…';
    try {
      let tvId = +d.id, tmdbId = null;
      if (d.src === 'tmdb'){
        tmdbId = +d.id; const ex = await tmdb(`/tv/${tmdbId}/external_ids`);
        let found = null;
        if (ex.imdb_id) found = await tvm('/lookup/shows?imdb=' + ex.imdb_id).catch(() => null);
        if (!found && ex.tvdb_id) found = await tvm('/lookup/shows?thetvdb=' + ex.tvdb_id).catch(() => null);
        if (!found){ el.textContent = 'Non trovata'; return; }
        tvId = found.id;
      }
      if (D.series[tvId]){ el.textContent = '✓ In lista'; el.classList.add('done'); return; }
      const sh = await fetchShow(tvId);
      await enrichShow(sh, tmdbId);
      D.series[tvId] = Object.assign(sh, {watched:{}, paused:false, notes:'', added:Date.now()});
      if (!D.lastCheck) D.lastCheck = Date.now();
      save(); el.textContent = '✓ In lista'; el.classList.add('done'); burst(el);
      if (d.rec){ setTimeout(() => { $('#modal').classList.remove('open'); render(); }, 500); }
      toast(`<b>${esc(showName(sh))}</b> aggiunta`, 'Apri', () => showSheet(tvId));
    } catch(e){ el.textContent = 'Riprova'; toast('Errore: ' + esc(e.message)); }
  },
  async addMovie(d, el){
    const col = el.parentElement; col.innerHTML = '<button class="add alt">…</button>';
    try {
      const m = await fetchMovie(d.id);
      D.movies[m.id] = Object.assign(m, {state:d.s, added:Date.now(), rating:0, comment:'', seenAt:d.s === 'seen' ? oggi() : ''});
      if (!D.lastCheck) D.lastCheck = Date.now();
      save(); col.innerHTML = `<button class="add done">${d.s === 'seen' ? '✓ Visto' : '✓ In lista'}</button>`; burst(col);
      if (d.s === 'seen') setTimeout(() => rateModal(m.id), d.rec ? 400 : 0); else { toast(`<b>${esc(m.title)}</b> tra i film da vedere`); if (d.rec) setTimeout(() => { $('#modal').classList.remove('open'); render(); }, 500); }
    } catch(e){ col.innerHTML = '<button class="add">Riprova</button>'; toast('Errore: ' + esc(e.message)); }
  },
  manual(d){
    const id = 'm' + Date.now();
    D.movies[id] = {id, title:d.q, state:'todo', added:Date.now(), rating:0, comment:'', seenAt:'', genres:[], prov:[]};
    save(); toast(`<b>${esc(d.q)}</b> aggiunto`); closeSheet();
  },
  quick(d, el){
    const sh = D.series[d.id], x = showStats(sh); if (!x.next) return;
    const ep = x.next; markEp(sh, ep.i, true); save(); burst(el);
    const fin = showStats(sh);
    toast(fin.st === 'finite' ? `🎉 Hai finito <b>${esc(showName(sh))}</b>!` : fin.st === 'attesa' ? `Sei al passo con <b>${esc(showName(sh))}</b>` : `${epCode(ep)} segnato come visto`, 'Annulla', () => { markEp(sh, ep.i, false); save(); refreshView(); });
    setTimeout(refreshView, 250);
    if (fin.st === 'finite' && !sh.myRating) setTimeout(() => rateShowModal(sh.id, true), 1200);
  },
  ep(d, el){
    const sh = D.series[d.id], on = !sh.watched[d.e]; markEp(sh, d.e, on); save();
    el.classList.toggle('on', on); if (on) burst(el);
    if (on){
      const t = oggi(), ep = sh.eps.find(e => e.i == d.e);
      const prev = sh.eps.filter(e => (e.s < ep.s || (e.s === ep.s && e.n < ep.n)) && e.d && e.d <= t && !sh.watched[e.i]);
      if (prev.length) toast(`Ci sono ${prev.length} episodi precedenti non spuntati`, 'Segna anche quelli', () => { prev.forEach(e => markEp(sh, e.i, true)); save(); refreshView(); }, 6000);
    }
    setTimeout(refreshView, 300);
  },
  season(d){ UI.season[d.id] = +d.s; showSheet(+d.id, true); },
  seasonAll(d){
    const sh = D.series[d.id], t = oggi(), eps = sh.eps.filter(e => e.s == d.s && e.d && e.d <= t);
    const all = eps.every(e => sh.watched[e.i]); eps.forEach(e => markEp(sh, e.i, !all)); save(); showSheet(+d.id, true);
    toast(all ? `Stagione ${d.s}: spunte tolte` : `Stagione ${d.s} segnata come vista`);
  },
  allShow(d){
    const sh = D.series[d.id], t = oggi(), todo = sh.eps.filter(e => e.d && e.d <= t && !sh.watched[e.i]);
    todo.forEach(e => markEp(sh, e.i, true)); save(); showSheet(+d.id, true); burst(document.querySelector('.ring') || document.body);
    toast(`🎉 <b>${esc(showName(sh))}</b>: tutta vista!`, 'Annulla', () => { todo.forEach(e => markEp(sh, e.i, false)); save(); refreshView(); }, 6000);
    if (!sh.myRating) setTimeout(() => rateShowModal(sh.id, sh.status === 'Ended'), 1200);
  },
  pause(d){ const sh = D.series[d.id]; sh.paused = !sh.paused; save(); showSheet(+d.id, true); toast(sh.paused ? 'Serie messa in pausa' : 'Bentornato!'); },
  removeShow(d){ const sh = D.series[d.id]; delete D.series[d.id]; save(); closeSheet(); toast(`<b>${esc(showName(sh))}</b> rimossa`, 'Annulla', () => { D.series[d.id] = sh; save(); render(); }); },
  removeMovie(d){ const m = D.movies[d.id]; delete D.movies[d.id]; save(); closeSheet(); toast(`<b>${esc(m.title)}</b> rimosso`, 'Annulla', () => { D.movies[d.id] = m; save(); render(); }); },
  unsee(d){ const m = D.movies[d.id]; m.state = 'todo'; save(); movieSheet(d.id); },
  rate(d){ rateModal(d.id); },
  tonight(){ UI.tn = null; tonightModal(UI.tab === 'film' ? 150 : 60); },
  tonightT(d){ UI.tn = null; tonightModal(+d.m); },
  tonightNext(){ UI.tn.i++; tonightModal(UI.tn.mins); },
  tonightGo(){ const p = UI.tn.list[UI.tn.i % UI.tn.list.length]; $('#modal').classList.remove('open'); p.type === 'show' ? showSheet(p.id) : movieSheet(p.id); },
  recOpen(d){ recModal(d.k, d.id); },
  year(){ yearSheet(); },
  star(d){ UI.rate.r = UI.rate.r === +d.n ? 0 : +d.n; document.querySelectorAll('.rate button').forEach((b, i) => b.classList.toggle('on', i < UI.rate.r)); },
  rateShow(d){ rateShowModal(d.id); },
  saveRate(){
    if (UI.rate.show){ const sh = D.series[UI.rate.id]; sh.myRating = UI.rate.r; sh.notes = $('#rCom').value.trim(); save(); $('#modal').classList.remove('open'); toast('✓ Giudizio salvato'); refreshView(); return; }
    const m = D.movies[UI.rate.id], first = m.state !== 'seen';
    Object.assign(m, {state:'seen', rating:UI.rate.r, seenAt:$('#rDate').value || oggi(), comment:$('#rCom').value.trim()});
    save(); $('#modal').classList.remove('open');
    if (first) toast(`🎬 <b>${esc(m.title)}</b> è nel tuo diario`);
    if (UI.open?.type === 'movie') movieSheet(m.id); else { UI.filmSeg = 'seen'; render(); }
  },
  closeModal(){ $('#modal').classList.remove('open'); },
  modalBg(d, el, ev){ if (ev.target.id === 'modal') $('#modal').classList.remove('open'); },
  openNews(d, el, ev){
    if (ev.target.closest('.x')) return;
    const n = D.news.find(x => x.id === d.id); if (!n) return;
    n.read = true; save();
    if (n.ref === 'show' && D.series[n.rid]) showSheet(n.rid); else if (n.ref === 'movie' && D.movies[n.rid]) movieSheet(n.rid); else render();
  },
  dismiss(d){ const n = D.news.find(x => x.id === d.id); if (n) n.read = true; save(); render(); },
  readAll(){ D.news.forEach(n => n.read = true); save(); render(); },
  checkNews(){ checkNews(true); },
  toggleIntro(){ C.intro = !C.intro; saveCfg(); render(); },
  async saveTmdb(){
    C.tmdb = $('#tmdbKey').value.trim(); saveCfg();
    if (!C.tmdb) return toast('Chiave rimossa');
    try { await tmdb('/configuration'); toast('✓ Chiave TMDB valida'); enrichAll().then(() => loadRecs(true)); } catch(e){ toast('La chiave non funziona, controllala'); }
  },
  async saveGh(){
    C.ghUser = $('#ghUser').value.trim(); C.ghRepo = $('#ghRepo').value.trim() || 'visto-dati'; C.ghToken = $('#ghToken').value.trim(); C.sha = ''; saveCfg();
    if (!C.ghToken) return toast('Sincronizzazione disattivata');
    toast('Sincronizzo…'); await pull(true); render();
    toast(C.syncErr ? 'Errore: ' + esc(C.syncErr) : '✓ Sincronizzazione attiva');
  },
  export(){
    const blob = new Blob([JSON.stringify(D)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `visto-backup-${oggi()}.json`; a.click();
  },
  import(){
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => { try { const x = JSON.parse(await i.files[0].text()); if (!x.series || !x.movies) throw 0; D = x; save(); render(); toast('✓ Copia importata'); } catch(e){ toast('File non valido'); } };
    i.click();
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f){ if (el.dataset.act !== 'modalBg' && el.dataset.act !== 'openNews') ev.stopPropagation(); f(el.dataset, el, ev); }
});
document.addEventListener('input', ev => {
  const t = ev.target; if (t.dataset.notes === 'show'){ D.series[t.dataset.id].notes = t.value; clearTimeout(UI.nt); UI.nt = setTimeout(save, 800); }
});

/* ---------- NOVITÀ (controllo settimanale) ---------- */
function addNews(n){ if (D.news.some(x => x.id === n.id)) return; D.news.push(Object.assign({read:false, at:Date.now()}, n)); }
async function checkNews(force){
  if (UI.busy) return;
  const WEEK = 7 * 864e5;
  if (!force && D.lastCheck && Date.now() - D.lastCheck < WEEK) return;
  const ss = Object.values(D.series), ms = Object.values(D.movies).filter(m => m.state === 'todo' && typeof m.id === 'number');
  if (!ss.length && !ms.length){ if (force) toast('Aggiungi qualche serie o film, poi controllo io'); return; }
  UI.busy = true; render();
  const t = oggi(), since = D.lastCheck ? new Date(D.lastCheck).toLocaleDateString('sv') : addDays(t, -7), week = addDays(t, 7);
  let errs = 0;
  for (const old of ss){
    if (old.status === 'Ended' && showStats(old).st === 'finite' && Date.now() - (old.lastFull || 0) < 30 * 864e5) continue;
    if (old.status === 'Ended') old.lastFull = Date.now();
    try {
      const nu = await fetchShow(old.id);
      const oldMax = Math.max(0, ...old.eps.map(e => e.s)), newMax = Math.max(0, ...nu.eps.map(e => e.s));
      const fresh = nu.eps.filter(e => e.d && e.d > since && e.d <= t && !old.watched[e.i]);
      const keep = {watched:old.watched, paused:old.paused, notes:old.notes, myRating:old.myRating, lastFull:old.lastFull, added:old.added, lastW:old.lastW, tmdb:old.tmdb, itName:old.itName, itPlot:old.itPlot, back:old.back, poster:old.poster, prov:old.prov, itEp:old.itEp};
      if (old.tmdb) keep.genres = old.genres;
      D.series[old.id] = Object.assign(nu, keep);
      const sh = D.series[old.id], name = showName(sh), img = showImg(sh, 'w185');
      if (C.tmdb && (fresh.length || nu.eps.length !== old.eps.length)) await enrichShow(sh, sh.tmdb);
      const prem = fresh.find(e => e.n === 1 && e.s > 1);
      if (prem && !(newMax > oldMax && oldMax > 0)) addNews({id:`ss-${sh.id}-${prem.s}`, ref:'show', rid:sh.id, kind:'new', hero:true, bg:showBack(sh), img, t:name, d:prem.d, k:'Nuova stagione', d2:`La stagione ${prem.s} è iniziata ${fGiorno(prem.d)}`});
      if (fresh.length) addNews({id:`ep-${sh.id}-${fresh[fresh.length - 1].i}`, ref:'show', rid:sh.id, kind:'new', img, t:name, d:fresh[fresh.length - 1].d,
        k:fresh.length > 1 ? `${fresh.length} nuovi episodi` : 'Nuovo episodio', d2:fresh.length > 1 ? `Da ${epCode(fresh[0])} a ${epCode(fresh[fresh.length - 1])}` : `${epCode(fresh[0])} · ${epT(sh, fresh[0])} · uscito ${fGiorno(fresh[0].d)}`});
      if (newMax > oldMax && oldMax > 0) addNews({id:`ss-${sh.id}-${newMax}`, ref:'show', rid:sh.id, kind:'new', hero:true, bg:showBack(sh), img, t:name, d:t, k:'Nuova stagione', d2:`Annunciata la stagione ${newMax}` + (sh.eps.find(e => e.s === newMax)?.d ? ` · dal ${fData(sh.eps.find(e => e.s === newMax).d, false)}` : '')});
      if (sh.next?.d && sh.next.d > t && sh.next.d <= week) addNews({id:`soon-${sh.id}-${sh.next.s}-${sh.next.n}`, ref:'show', rid:sh.id, kind:'soon', img, t:name, d:sh.next.d, k:'In arrivo', d2:`${epCode(sh.next)} esce ${fGiorno(sh.next.d)}`});
      await sleep(250);
    } catch(e){ errs++; }
  }
  if (C.tmdb) for (const old of ms){
    try {
      const nu = await fetchMovie(old.id);
      const oldProv = new Set((old.prov || []).map(p => p.n)), added = (nu.prov || []).filter(p => !oldProv.has(p.n));
      D.movies[old.id] = Object.assign(old, {rel:nu.rel, digital:nu.digital, prov:nu.prov, rent:nu.rent, plot:nu.plot || old.plot, poster:nu.poster || old.poster, back:nu.back || old.back});
      const img = movImg(old, 'w185');
      if (old.rel && old.rel > since && old.rel <= t) addNews({id:`rel-${old.id}`, ref:'movie', rid:old.id, kind:'new', img, t:old.title, d:old.rel, k:'Uscito al cinema', d2:`In sala da ${fGiorno(old.rel)}`});
      if (old.rel && old.rel > t && old.rel <= week) addNews({id:`relsoon-${old.id}`, ref:'movie', rid:old.id, kind:'soon', img, t:old.title, d:old.rel, k:'In arrivo al cinema', d2:`Esce ${fGiorno(old.rel)}`});
      if (added.length && old.prov) addNews({id:`prov-${old.id}-${added[0].n}`, ref:'movie', rid:old.id, kind:'new', img, t:old.title, d:t, k:'Ora in streaming', d2:`Disponibile su ${added.map(p => p.n).join(', ')}`});
      await sleep(150);
    } catch(e){ errs++; }
  }
  D.news = D.news.filter(n => !(n.read && Date.now() - n.at > 30 * 864e5));
  D.lastCheck = Date.now(); UI.busy = false; save(); render();
  if (force){ const n = D.news.filter(x => !x.read).length; toast(errs ? `Controllo fatto, ${errs} titoli non raggiunti` : n ? `${n} novità per te` : 'Tutto aggiornato, nessuna novità'); }
}
async function enrichAll(){
  for (const sh of Object.values(D.series)) if (!sh.tmdb || !sh.itEp){ await enrichShow(sh, sh.tmdb); await sleep(120); }
  save(); render();
}

/* ---------- SINCRONIZZAZIONE GITHUB ---------- */
const ghUrl = () => `https://api.github.com/repos/${encodeURIComponent(C.ghUser)}/${encodeURIComponent(C.ghRepo)}/contents/visto.json`;
const ghH = () => ({Authorization:'Bearer ' + C.ghToken, Accept:'application/vnd.github+json'});
const b64e = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(x); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
async function pull(pushIfOlder){
  if (!C.ghToken || !C.ghUser) return;
  try {
    const r = await fetch(ghUrl() + '?t=' + Date.now(), {headers:ghH(), cache:'no-store'});
    if (r.status === 404){ C.sha = ''; C.syncErr = ''; saveCfg(); await push(); return; }
    if (r.status === 401) throw new Error('token non valido');
    if (!r.ok) throw new Error('GitHub ' + r.status);
    const j = await r.json(); C.sha = j.sha;
    let remote = null;
    if (j.content) remote = JSON.parse(b64d(j.content));
    else { const raw = await fetch(j.download_url, {headers:ghH(), cache:'no-store'}); remote = await raw.json(); }
    if (remote && remote.upd > D.upd){ D = remote; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} if (!$('#sheet').classList.contains('open')) render(); }
    else if (remote && D.upd > remote.upd && pushIfOlder !== false) await push();
    C.syncErr = ''; C.lastSync = Date.now(); saveCfg();
  } catch(e){ C.syncErr = e.message; saveCfg(); }
}
function pushLater(){ if (!C.ghToken) return; clearTimeout(UI.pt); UI.pt = setTimeout(push, 1500); }
async function push(retry = true){
  if (!C.ghToken || !C.ghUser) return;
  try {
    const body = {message:'Visto: aggiornamento ' + new Date().toLocaleString('it-IT'), content:b64e(JSON.stringify(D))};
    if (C.sha) body.sha = C.sha;
    const r = await fetch(ghUrl(), {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, ghH()), body:JSON.stringify(body)});
    if ((r.status === 409 || r.status === 422) && retry){
      const g = await fetch(ghUrl() + '?t=' + Date.now(), {headers:ghH(), cache:'no-store'});
      if (g.ok){ C.sha = (await g.json()).sha; return push(false); }
    }
    if (r.status === 401) throw new Error('token non valido');
    if (r.status === 404) throw new Error('repository non trovato');
    if (!r.ok) throw new Error('GitHub ' + r.status);
    C.sha = (await r.json()).content.sha; C.syncErr = ''; C.lastSync = Date.now(); saveCfg();
  } catch(e){ C.syncErr = e.message; saveCfg(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ pull().then(() => checkNews(false)); } });

/* ---------- INTRO: collage di locandine ---------- */
const FALLBACK = ['Il viaggio','Notte stellata','La casa sulla collina','Orizzonte','Ultima frontiera','Segnali','Il faro','Nebbia','Gravità','Ritorno','La stanza','Il segreto','Oltre','Mezzanotte','L\'isola','Eclissi'];
async function posterPool(){
  const cache = load(POSTERS);
  if (cache && Date.now() - cache.at < 7 * 864e5 && cache.list.length > 20) return cache.list;
  const list = [];
  try {
    for (const p of [0, 1, 2]){
      const shows = await tvm('/shows?page=' + p);
      shows.filter(s => s.image?.medium && (s.rating?.average || 0) >= 8).forEach(s => list.push(s.image.medium));
    }
  } catch(e){}
  if (C.tmdb) try {
    for (const p of [1, 2]){ const r = await tmdb('/trending/all/week', {page:p}); r.results.filter(x => x.poster_path).forEach(x => list.push(IMG + 'w342' + x.poster_path)); }
  } catch(e){}
  if (list.length > 20){ try { localStorage.setItem(POSTERS, JSON.stringify({at:Date.now(), list})); } catch(e){} }
  return list.length ? list : (cache?.list || []);
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildWall(list){
  const mine = [...Object.values(D.series).map(s => showImg(s)), ...Object.values(D.movies).map(m => movImg(m))].filter(Boolean);
  let pool = shuffle([...new Set([...mine, ...list])]);
  const ncol = 9, per = 10, wall = $('#wall'); if (!wall) return;
  let html = '';
  for (let c = 0; c < ncol; c++){
    let items = '';
    const col = [];
    for (let i = 0; i < per; i++){
      const k = c * per + i;
      col.push(pool.length ? `<div class="wp"><img src="${esc(pool[k % pool.length])}" alt="" onload="this.classList.add('ok')"></div>`
        : `<div class="wp fake" style="background:linear-gradient(160deg,${PH_COL[k % 6]},#0d0b14)">${esc(FALLBACK[k % FALLBACK.length])}</div>`);
    }
    items = col.join('');
    html += `<div class="col ${c % 2 ? 'down' : ''}">${items}${items}</div>`;
  }
  wall.innerHTML = html;
}
function introStats(){
  const ns = Object.keys(D.series).length, nm = Object.values(D.movies).filter(m => m.state === 'seen').length, nn = D.news.filter(n => !n.read).length;
  $('#introStats').textContent = ns || nm ? `${ns} serie · ${nm} film visti${nn ? ` · ${nn} novità` : ''}` : '';
}

/* ---------- AVVIO ---------- */
(async function init(){
  render();
  if (C.intro){
    introStats();
    const cache = load(POSTERS); buildWall(cache?.list || []);
    posterPool().then(list => { if (!cache && list.length) buildWall(list); });
  } else $('#intro').remove();
  await pull();
  if (C.tmdb && Object.values(D.series).some(s => !s.tmdb || !s.itEp)) enrichAll();
  await checkNews(false);
  loadRecs();
})();
</script>
